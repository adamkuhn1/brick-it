[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["engine", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "pillow>=10"]

[project.optional-dependencies]
model = ["torch>=2.2", "torchvision", "rembg>=2.0.50", "onnxruntime", "omegaconf", "einops", "transformers>=4.35,<4.50", "huggingface-hub", "PyMCubes", "xatlas", "imageio"]

[tool.uv.sources]
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
