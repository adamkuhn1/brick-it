[project]
name = "lego-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["engine", "server"]

[project.optional-dependencies]
model = ["server[model]"]

[tool.uv.workspace]
members = ["engine", "server"]

[tool.uv.sources]
engine = { workspace = true }
server = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "server/tests"]
markers = ["slow: runs TripoSR"]
